name: CI

# Runs on every PR to master and every push to a working branch.
# Gate = compile. Tests and lint run too, but are reported without blocking,
# because the repo currently carries known-failing tests and lint warnings.
on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      # ── Gate: the build must compile ─────────────────────────────────────
      - name: Build
        run: dotnet build --no-restore -c Release

      # ── Reported, non-blocking: known pre-existing failures ──────────────
      - name: Test (reported)
        continue-on-error: true
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (Vite / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uOrgHub.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: uOrgHub.Web/package-lock.json

      - name: Install
        run: npm ci

      # ── Gate: tsc type-check + vite build must pass ──────────────────────
      - name: Build
        run: npm run build

      # ── Reported, non-blocking: 48 known lint findings ───────────────────
      - name: Lint (reported)
        continue-on-error: true
        run: npm run lint
